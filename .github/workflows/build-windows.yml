name: Build Windows EXE

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30   # 正常构建 5-10 分钟；卡死时快速失败而不是烧 6 小时
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout

      - name: Run tests
        timeout-minutes: 10
        run: |
          python -m pytest tests/ -v -ra --timeout=120 --junitxml=test-results/windows.xml

      - name: Require lifecycle tests without skips
        run: python tools/check_lifecycle_results.py test-results/windows.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results/windows.xml
          if-no-files-found: warn

      - name: Build single-file exe with PyInstaller
        timeout-minutes: 15
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LlamaHelper --icon assets/icon.ico --add-data "assets;assets" --collect-submodules psutil main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LlamaHelper-windows
          path: dist/LlamaHelper.exe
          if-no-files-found: error
