name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30   # 正常构建 5-10 分钟；卡死时快速失败而不是烧 6 小时
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        timeout-minutes: 10
        run: |
          pip install pytest pytest-timeout
          python -m pytest tests/ -v --timeout=120

      - name: Build single-file exe with PyInstaller
        timeout-minutes: 15
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LlamaHelper --collect-submodules psutil main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LlamaHelper-windows
          path: dist/LlamaHelper.exe
          if-no-files-found: error
